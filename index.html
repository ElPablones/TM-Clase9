<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arpegiador por Gestos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        #webcam-container canvas { border-radius: 8px; border: 3px solid #00e5ff; margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #00e5ff; color: #000; border: none; border-radius: 4px; font-weight: bold; }
        #status { margin-top: 20px; font-size: 24px; color: #00e5ff; }
    </style>
</head>
<body>

    <h2>🎹 Arpegiador Pentatónico</h2>
    <button id="start-btn" onclick="init()">Iniciar Cámara y Audio</button>
    
    <div id="webcam-container"></div>
    <div id="status">Esperando...</div>

    <script>
        // REEMPLAZA ESTA URL CON EL ENLACE DE TU MODELO TENSORFLOW.JS DE TEACHABLE MACHINE
        const URL = "https://teachablemachine.withgoogle.com/models/TU_ENLACE_AQUI/";

        let model, webcam, maxPredictions;
        let isPlaying = false;
        let currentGesture = "";

        // Mapeo de gestos a acordes (Progresión armónica)
        const arpegios = {
            "abajo": ["C3", "E3", "G3", "C4"],       // Do Mayor
            "izquierda": ["D3", "F3", "A3", "D4"],   // Re Menor
            "derecha": ["E3", "G3", "B3", "E4"],     // Mi Menor
            "arriba": ["G3", "B3", "D4", "G4"]       // Sol Mayor
        };

        // Configuración del motor de síntesis (Tone.js)
        // Apilamos 3 osciladores Sawtooth para un sonido más analógico y denso
        const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "fatsawtooth", count: 3, spread: 30 },
            envelope: { attack: 0.01, decay: 0.1, sustain: 0.5, release: 1 }
        }).toDestination();

        // Creamos el patrón del arpegiador (16 notas por compás)
        const arpeggiator = new Tone.Pattern(function(time, note){
            synth.triggerAttackRelease(note, "16n", time);
        }, arpegios["abajo"], "upDown"); // Comienza con Do Mayor, patrón arriba-abajo

        async function init() {
            document.getElementById("start-btn").style.display = "none";
            await Tone.start();
            Tone.Transport.bpm.value = 120;
            Tone.Transport.start();

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(400, 400, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            // Buscar la clase con mayor probabilidad
            let highestProb = 0;
            let bestClass = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass = prediction[i].className.toLowerCase();
                }
            }

            // Lógica de interacción y control del arpegiador
            if (highestProb > 0.85) {
                if (currentGesture !== bestClass) {
                    currentGesture = bestClass;
                    
                    if (arpegios[currentGesture]) {
                        // Actualiza las notas del arpegiador dinámicamente
                        arpeggiator.values = arpegios[currentGesture];
                        
                        if (!isPlaying) {
                            arpeggiator.start(0);
                            isPlaying = true;
                        }
                        document.getElementById("status").innerText = "Tocando: " + currentGesture.toUpperCase();
                    }
                }
            } else {
                // Silenciar si no hay un gesto claro
                if (isPlaying) {
                    arpeggiator.stop();
                    isPlaying = false;
                    currentGesture = "";
                    document.getElementById("status").innerText = "Sin detectar gesto...";
                }
            }
        }
    </script>
</body>
</html>
